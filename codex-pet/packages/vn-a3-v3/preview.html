<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VN A3 v3 · 动作预览</title>
<style>
  :root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#24272c;background:#f4f1eb;color-scheme:light}
  *{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:40px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:28px;margin:0 0 8px}p{line-height:1.6;margin:6px 0;color:#686c72}.tag{font-size:13px;padding:7px 12px;border:1px solid #d9d4ca;border-radius:30px;white-space:nowrap}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:24px;margin:28px 0}.viewer{background:#fff;border:1px solid #e1ddd6;border-radius:20px;overflow:hidden}.stage{height:360px;position:relative;background:#f7f6f2;touch-action:none}.stage.dark{background:#222833}.stage.grid{background-color:#fff;background-image:linear-gradient(45deg,#ececec 25%,transparent 25%),linear-gradient(-45deg,#ececec 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ececec 75%),linear-gradient(-45deg,transparent 75%,#ececec 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
  .pet{position:absolute;left:50%;top:50%;width:192px;height:208px;background-repeat:no-repeat;image-rendering:pixelated;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;pointer-events:none}.guide{position:absolute;bottom:12px;left:16px;right:16px;text-align:center;font-size:13px;color:#747c86;pointer-events:none}.stage.dark .guide{color:#b3bbc5}
  .toolbar{padding:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:1px solid #d9d7d2;border-radius:10px;background:#fff;color:inherit;padding:9px 12px;cursor:pointer}button:hover{border-color:#b87755}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #c78765;outline-offset:2px}button.active{background:#913f33;border-color:#913f33;color:#fff}button:disabled{opacity:.45;cursor:default}.states{display:grid;gap:8px}.states button{text-align:left}.states small{display:block;opacity:.7;font-size:12px;margin-top:3px}.timeline{display:flex;align-items:center;gap:12px;padding:0 18px 20px}.timeline input{flex:1;min-width:60px}.count{font-size:13px;color:#70767d;width:70px}.details{background:#ece8e0;border-radius:14px;padding:16px 20px}.details strong{font-size:16px}.directions{display:none;grid-template-columns:repeat(8,1fr);gap:5px;padding:0 18px 18px}.directions button{padding:7px 0;font-size:12px}footer{font-size:13px;color:#73767b;margin:24px 0}a{color:#854333}@media(max-width:680px){main{margin-top:24px}.layout{grid-template-columns:1fr}.states{grid-template-columns:repeat(3,1fr)}.stage{height:300px}header{align-items:flex-start;flex-direction:column}.tag{white-space:normal}}
.filmstrip{display:flex;gap:8px;overflow:auto;margin:16px 0;padding:4px 0 12px}.filmstrip button{flex:none;padding:4px;background:#e9e7e1}.filmstrip button.active{outline:2px solid #913f33;color:#24272c}.thumbnail{display:block;width:96px;height:104px;background-repeat:no-repeat;background-size:768px 1144px;image-rendering:pixelated}.filmstrip small{font-size:11px}.filmstrip button:focus-visible{outline:3px solid #c78765}</style>
<main>
  <header><div><h1>VN A3 v3 · 动作预览</h1><p>9 组动作与 16 个注视方向，可暂停、逐帧查看或移动鼠标互动。</p></div><span class="tag">VN · 圆润版</span></header>
  <div class="layout"><section class="viewer" aria-label="动画播放器"><div class="stage" id="stage"><div class="pet" id="pet"></div><div class="guide" id="guide">可暂停后逐帧查看</div></div><div class="toolbar"><button id="play">暂停</button><button id="next">下一帧</button><select id="size" aria-label="显示大小"><option value="0.5">半尺寸</option><option value="1" selected>原生尺寸</option><option value="1.5">1.5 倍</option><option value="2">2 倍</option></select><select id="background" aria-label="背景"><option value="">浅色底</option><option value="dark">深色底</option><option value="grid">透明网格</option></select></div><div class="timeline"><input id="frame" type="range" min="0" max="5" value="0" aria-label="动画帧"><span class="count" id="count"></span></div><div class="directions" id="directions"></div></section><nav class="states" id="states" aria-label="选择动作"></nav></div>
  <section class="details"><strong id="title">空闲</strong><p id="description"></p></section>
  <div class="filmstrip" id="filmstrip" aria-label="当前动作逐帧对照"></div>
  <footer>预览节奏用于展示素材，实际动作触发与播放由 Codex 控制。<a href="README.md">安装说明</a></footer>
</main>
<script>
const states=[
 {id:'idle',name:'空闲',row:0,times:[280,110,110,140,140,320],text:'小微笑、轻微呼吸与眨眼，脚底保持稳定。'},
 {id:'running-right',name:'向右小跑',row:1,times:[120,120,120,120,120,120,120,220],text:'检查朝向、交替步伐和身体起伏。'},
 {id:'running-left',name:'向左小跑',row:2,times:[120,120,120,120,120,120,120,220],text:'单独绘制左向动作，保留偏分发型的方向。'},
 {id:'waving',name:'打招呼',row:3,times:[140,140,140,280],text:'抬手、张掌挥动，再自然回落。'},
 {id:'jumping',name:'跳跃',row:4,times:[140,140,140,140,280],text:'屈膝、轻轻跃起、落地缓冲，留意比例和落脚位置。'},
 {id:'failed',name:'受阻',row:5,times:[140,140,140,140,140,140,140,240],text:'低头、垮肩，再稍稍恢复。'},
 {id:'waiting',name:'等待回应',row:6,times:[150,150,150,150,150,260],text:'摊手、耸肩，用表情向你询问。'},
 {id:'running',name:'工作中',row:7,times:[120,120,120,120,120,220],text:'固定同一只手摸下巴，眉眼专注；检查是否突然换手。'},
 {id:'review',name:'查看结果',row:8,times:[150,150,150,150,150,280],text:'抱臂审视、轻微点头。'},
 {id:'look',name:'注视方向',row:9,times:Array(16).fill(220),text:'在画面内移动指针，或暂停后点选方向，检查头部与眼睛的朝向。'}
];
const pet=document.getElementById('pet'), stage=document.getElementById('stage'), slider=document.getElementById('frame'), count=document.getElementById('count'), play=document.getElementById('play');
let selected=0,frame=0,playing=true,timer=null,hasLook=false;
states.forEach((s,i)=>{const button=document.createElement('button');button.textContent=s.name;button.dataset.index=i;button.disabled=s.id==='look';button.onclick=()=>select(i);document.getElementById('states').append(button)});
for(let i=0;i<16;i++){const b=document.createElement('button');b.textContent=(i*22.5)+'°';b.onclick=()=>{pause();frame=i;draw()};document.getElementById('directions').append(b)}
function draw(){const s=states[selected];const row=s.id==='look'?9+Math.floor(frame/8):s.row,col=s.id==='look'?frame%8:frame;pet.style.backgroundPosition=(-col*192)+'px '+(-row*208)+'px';slider.value=frame;count.textContent=(frame+1)+' / '+s.times.length;document.querySelectorAll('#directions button').forEach((b,i)=>b.classList.toggle('active',i===frame));document.querySelectorAll('#filmstrip button').forEach((b,i)=>b.classList.toggle('active',i===frame))}
function buildFilmstrip(){const s=states[selected],strip=document.getElementById('filmstrip');strip.replaceChildren();s.times.forEach((t,i)=>{const b=document.createElement('button'),thumb=document.createElement('span'),label=document.createElement('small');thumb.className='thumbnail';thumb.style.backgroundImage=pet.style.backgroundImage;const row=s.id==='look'?9+Math.floor(i/8):s.row,col=s.id==='look'?i%8:i;thumb.style.backgroundPosition=(-col*96)+'px '+(-row*104)+'px';label.textContent=s.id==='look'?(i*22.5)+'°':(i+1)+' · '+t+' ms';b.setAttribute('aria-label',s.id==='look'?'方向 '+i*22.5+' 度':'第 '+(i+1)+' 帧');b.append(thumb,label);b.onclick=()=>{pause();frame=i;draw()};strip.append(b)})}
function schedule(){clearTimeout(timer);if(playing)timer=setTimeout(()=>{frame=(frame+1)%states[selected].times.length;draw();schedule()},states[selected].times[frame])}
function pause(){playing=false;play.textContent='播放';clearTimeout(timer)}
function select(i){if(states[i].id==='look'&&!hasLook)return;selected=i;frame=0;slider.max=states[i].times.length-1;document.getElementById('title').textContent=states[i].name;document.getElementById('description').textContent=states[i].text;document.getElementById('directions').style.display=states[i].id==='look'?'grid':'none';document.getElementById('guide').textContent=states[i].id==='look'?'移动指针，观察注视方向':'可暂停后逐帧查看';document.querySelectorAll('#states button').forEach((b,j)=>b.classList.toggle('active',i===j));buildFilmstrip();draw();schedule()}
play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'播放';schedule()};document.getElementById('next').onclick=()=>{pause();frame=(frame+1)%states[selected].times.length;draw()};slider.oninput=()=>{pause();frame=Number(slider.value);draw()};document.getElementById('size').onchange=e=>{const scale=Number(e.target.value);pet.style.setProperty('--scale',scale);stage.style.height=Math.max(window.innerWidth<=680?300:360,208*scale+48)+'px'};document.getElementById('background').onchange=e=>stage.className='stage '+e.target.value;
stage.onpointermove=e=>{if(states[selected].id!=='look')return;const r=stage.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;pause();if(Math.hypot(dx,dy)<25){pet.style.backgroundPosition='-1152px 0px';count.textContent='中立';document.querySelectorAll('#directions button,#filmstrip button').forEach(b=>b.classList.remove('active'));return}frame=Math.round((Math.atan2(dx,-dy)*180/Math.PI+360)%360/22.5)%16;draw()};
const atlas=new Image();atlas.onload=()=>{hasLook=atlas.height===2288;pet.style.backgroundImage='url("'+atlas.src+'")';document.querySelector('#states button[data-index="9"]').disabled=!hasLook;select(0)};atlas.onerror=()=>{pause();document.getElementById('guide').textContent='图集加载失败，请将 preview.html 与 spritesheet.webp 保持在同一目录';};atlas.src='spritesheet.webp';
</script>
</html>
